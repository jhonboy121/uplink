[package]
name = "uplink-core"
description = "Platform-agnostic core: identity, contacts, iroh endpoint, call signalling"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
ab_glyph.workspace = true
# PNG in and out: the mark that goes in the middle of a code, and the card that comes out.
image = { workspace = true, features = ["png"] }
iroh.workspace = true
noq-proto.workspace = true
opus-sys.workspace = true
postcard.workspace = true
qrcode.workspace = true
rqrr.workspace = true
rusqlite.workspace = true
rustls.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "macros", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
anyhow.workspace = true
tempfile.workspace = true

[lints]
workspace = true
