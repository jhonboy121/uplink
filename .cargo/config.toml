[target.aarch64-linux-android]
linker = "tools/android-clang"

[env]
CC_aarch64_linux_android = { value = "tools/android-clang", relative = true }
# Only probed (aws-lc-sys' builder and cmake-rs ask for both compilers); no C dep builds C++.
CXX_aarch64_linux_android = { value = "tools/android-clang", relative = true }
AR_aarch64_linux_android = "llvm-ar"
# The `slint!` macro bundles every language under here into the binary. It looks for
# `<lang>/LC_MESSAGES/<package name>.po`, so ui-preview's catalogue is a link to the app's.
SLINT_BUNDLE_TRANSLATIONS = { value = "crates/uplink/lang", relative = true }

[net]
retry = 10

[http]
timeout = 120
