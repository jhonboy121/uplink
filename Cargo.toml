[workspace]
resolver = "3"
members = [
  "crates/*",
  "tools/android-res",
  "tools/ndk-bindgen",
  "tools/ui-preview",
]
# Forks by submodule + generated bindings: built as path deps, not linted as ours.
exclude = ["sys", "external"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
uplink-android = { path = "crates/uplink-android" }
uplink-core = { path = "crates/uplink-core" }
ndk-gl-sys = { path = "sys/ndk-gl-sys" }
# Opus: a pure-Rust port of libopus 1.6.1, bit-exact with it; a git submodule, by path.
opusorus = { path = "external/opusorus/crates/opusorus" }
# The CLI's camera: a pure-Rust OpenH264 port (submodule), decoding the clip and encoding it live
# at rate control's bitrate, as MediaCodec does on the phone. See external/h264/docs/STATUS.md.
h264 = { path = "external/h264", features = ["threads", "simd"] }

# Glyph outlines and their rasterisation, for the line of text on the shared identity card. Two
# small crates; a full image-processing library would be a lot of machinery for one line.
ab_glyph = "0.2"
# Shapes the identity card's caption: Arabic joins and runs right to left, which drawing glyphs
# one character at a time cannot do. Already under Slint's own text layout.
harfrust = { version = "0.12", default-features = false, features = ["std"] }
# A pointer that is read constantly and replaced rarely, without a lock on the read side. The
# activity is exactly that: every platform call looks at it, and it changes twice in its life.
arc-swap = "1"
android-activity = { version = "0.6", default-features = false, features = [
  "native-activity",
] }
bindgen = { version = "=0.72.1", default-features = false, features = [
  "logging",
  "prettyplease",
] }
clap = { version = "4.6", features = ["derive", "env"] }
# Read-only XML DOM, no transitive dependencies: android-res compiles real XML to Android's
# binary form, so the manifest and resources are XML in the repo rather than Rust element trees.
roxmltree = "0.20"
# The writing half: android-res generates the vector drawables as elements and attributes, not
# strings. Already in the lock through Slint's SVG support, so it costs nothing new.
xmlwriter = "0.1"
# Contacts, the call log and settings: Turso, a pure-Rust rewrite of SQLite reading and writing
# its file format, async throughout. Pinned: it is a pre-release, and contacts are the one thing
# here a person cannot regenerate. No default features: those add a C allocator and full-text
# search, and on Android it is then entirely Rust (plain file IO, pure-Rust crypto).
turso = { version = "=0.8.0-pre.13", default-features = false }
# Deflate and CRC32 for the APK writer, pure Rust: `zipalign` is x86-64 like aapt2, and API 30+
# refuses an APK whose resources.arsc is compressed or unaligned.
flate2 = { version = "1.1", default-features = false, features = [
  "rust_backend",
] }
image = { version = "0.25", default-features = false }
# The wire. Protobuf for its evolution rules — tagged fields, unknown ones skipped, a `oneof` kind
# an older build does not know read as none — written as derived Rust structs, so no `.proto`,
# no `protoc`, no build script. The format is a spec, not this crate: Google's own Rust protobuf
# reads the same bytes, should prost (in maintenance, fixes only) ever need replacing.
prost = "0.14"
# `StreamExt`, for iroh's own streams (a connection's path events): the crate iroh itself uses,
# already in the tree through it.
n0-future = "0.3"
# `metrics` is how a backgrounded endpoint is observable at all: the socket counters are the only
# record of what it did overnight with no window and nothing in the log. Without the feature they
# compile to no-ops, which is why the heartbeat had nothing to report.
iroh = { version = "1.2", default-features = false, features = [
  "tls-aws-lc-rs",
  "portmapper",
  "metrics",
  "unstable-net-report",
] }
jni = "0.22"
libc = "0.2"
mp4-atom = "0.15"
ndk = { version = "0.9", default-features = false, features = [
  "audio",
  "media",
  "nativewindow",
  "api-level-31",
] }
ndk-sys = { version = "0.6", features = ["camera", "media"] }
# The JavaVM + Context that iroh's DNS and netdev read over JNI; set by us before the core starts.
ndk-context = "0.1"
noq-proto = { version = "1.3", default-features = false }
# Locks without poisoning: a panic under a lock here is a bug to fix, not a state every caller
# has to unwrap past. Smaller and faster uncontended than std's, which is what ours always are.
parking_lot = "0.12"
qrcode = { version = "0.14", default-features = false }
rqrr = { version = "0.9", default-features = false }
# The CLI's call TUI; its crossterm backend is re-exported, so it is the one terminal dependency.
ratatui = "0.30"
rtrb = "0.4"
# FxHashMap: std's SipHash buys resistance to an attacker choosing keys to collide, and nothing
# here has that shape — request codes are our own counter, and contact keys are public keys,
# already uniform. Nothing untrusted picks a key in any map in this app.
rustc-hash = "2"
# The diagnostics archive. gzip rather than zstd: flate2's rust_backend is already here for the
# APK writer, and zstd would add a C library for a file that is sent once.
tar = { version = "0.4", default-features = false }
rustls = { version = "0.23.33", default-features = false, features = [
  "aws_lc_rs",
  "std",
] }
serde = { version = "1", features = ["derive"] }
slint = { version = "=1.18.1", default-features = false, features = [
  "std",
  "compat-1-2",
  "backend-android-activity-06",
] }
# Our icons are SVG, and `slint` exposes no feature that turns SVG rendering on.
i-slint-core = { version = "=1.18.1", default-features = false, features = [
  "svg",
] }
# Never called: a build-dependency only so the `slint!` macro's compiler (a host crate, which
# feature-unifies with build-dependencies) bundles `lang/` from SLINT_BUNDLE_TRANSLATIONS.
# `slint-macros` does not enable it itself, and this avoids a build script.
i-slint-compiler = { version = "=1.18.1", default-features = false, features = [
  "bundle-translations",
] }
# The phone's language, when the app is set to follow it. Already under Slint for the same job.
sys-locale = "0.3"
symphonia = { version = "0.5", default-features = false, features = ["aac"] }
tempfile = "3"
tokio = { version = "1", default-features = false }
tokio-util = { version = "0.7", default-features = false }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "std",
  "fmt",
  "registry",
] }
# Only for `non_blocking`: its own rolling appender rotates by time, and the log has to roll by
# size. A `tracing` subscriber takes a synchronous writer, so this is what keeps the write off
# whichever thread logged.
tracing-appender = { version = "0.2", default-features = false }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
missing_const_for_fn = "warn"

# One ndk/ndk-sys for the whole graph (Slint, android-activity, us). See docs/ref/ndk-vendoring.md.
[patch.crates-io]
ndk = { path = "external/ndk/ndk" }
ndk-sys = { path = "external/ndk/ndk-sys" }
# First caller wins instead of panicking, so the app can set it before android-activity does.
# See docs/ref/ndk-vendoring.md.
ndk-context = { path = "external/ndk-context/ndk-context" }
# Android's default route from ConnectivityManager: apps may no longer read it the ways netwatch
# tries, and iroh then holds every network change back for 5 s. See docs/ref/ndk-vendoring.md.
netwatch = { path = "external/net-tools/netwatch" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# The CLI: it decodes and encodes live, at up to 1080p60.
[profile.opt]
inherits = "release"
lto = true
strip = true
