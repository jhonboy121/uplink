[workspace]
resolver = "3"
members = ["crates/*", "tools/android-res", "tools/ndk-bindgen", "tools/ui-preview"]
# Vendored upstream + generated bindings: built as path deps, not linted as ours.
exclude = ["vendor", "sys"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
uplink-android = { path = "crates/uplink-android" }
uplink-core = { path = "crates/uplink-core" }
ndk-gl-sys = { path = "sys/ndk-gl-sys" }
opus-sys = { path = "sys/opus-sys" }

# Glyph outlines and their rasterisation, for the line of text on the shared identity card. Two
# small crates; a full image-processing library would be a lot of machinery for one line.
ab_glyph = "0.2"
# A pointer that is read constantly and replaced rarely, without a lock on the read side. The
# activity is exactly that: every platform call looks at it, and it changes twice in its life.
arc-swap = "1"
android-activity = { version = "0.6", default-features = false, features = ["native-activity"] }
bindgen = { version = "=0.72.1", default-features = false, features = ["logging", "prettyplease"] }
clap = { version = "4.6", features = ["derive", "env"] }
# Read-only XML DOM, no transitive dependencies: android-res compiles real XML to Android's
# binary form, so the manifest and resources are XML in the repo rather than Rust element trees.
roxmltree = "0.20"
# Contacts. `bundled` compiles SQLite's own C through our clang wrapper, like libopus; the
# alternative pure-Rust rewrite is beta by its maintainers' own account, and contacts are the one
# thing here a person cannot regenerate.
rusqlite = { version = "0.37", features = ["bundled"] }
# Deflate and CRC32 for the APK writer, pure Rust: `zipalign` is x86-64 like aapt2, and API 30+
# refuses an APK whose resources.arsc is compressed or unaligned.
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
image = { version = "0.25", default-features = false }
# `metrics` is how a backgrounded endpoint is observable at all: the socket counters are the only
# record of what it did overnight with no window and nothing in the log. Without the feature they
# compile to no-ops, which is why the heartbeat had nothing to report.
iroh = { version = "1.2", default-features = false, features = ["tls-aws-lc-rs", "portmapper", "metrics"] }
jni = "0.22"
libc = "0.2"
mp4-atom = "0.15"
ndk = { version = "0.9", default-features = false, features = ["audio", "media", "api-level-30"] }
ndk-sys = { version = "0.6", features = ["camera", "media"] }
noq-proto = { version = "1.3", default-features = false }
# Locks without poisoning: a panic under a lock here is a bug to fix, not a state every caller
# has to unwrap past. Smaller and faster uncontended than std's, which is what ours always are.
parking_lot = "0.12"
postcard = { version = "1", default-features = false, features = ["use-std"] }
qrcode = { version = "0.14", default-features = false }
rqrr = { version = "0.9", default-features = false }
rtrb = "0.4"
# FxHashMap: std's SipHash buys resistance to an attacker choosing keys to collide, and nothing
# here has that shape — request codes are our own counter, and contact keys are public keys,
# already uniform. Nothing untrusted picks a key in any map in this app.
rustc-hash = "2"
# The diagnostics archive. gzip rather than zstd: flate2's rust_backend is already here for the
# APK writer, and zstd would add a C library for a file that is sent once.
tar = { version = "0.4", default-features = false }
rustls = { version = "0.23.33", default-features = false, features = ["aws_lc_rs", "std"] }
serde = { version = "1", features = ["derive"] }
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-android-activity-06"] }
# Our icons are SVG, and `slint` exposes no feature that turns SVG rendering on.
i-slint-core = { version = "=1.18.1", default-features = false, features = ["svg"] }
symphonia = { version = "0.5", default-features = false, features = ["aac"] }
tempfile = "3"
tokio = { version = "1", default-features = false }
tokio-util = { version = "0.7", default-features = false }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "registry"] }
# Only for `non_blocking`: its own rolling appender rotates by time, and the log has to roll by
# size. A `tracing` subscriber takes a synchronous writer, so this is what keeps the write off
# whichever thread logged.
tracing-appender = { version = "0.2", default-features = false }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
missing_const_for_fn = "warn"

# One ndk/ndk-sys for the whole graph (Slint, android-activity, us). See docs/ref/ndk-vendoring.md.
[patch.crates-io]
ndk = { path = "external/ndk/ndk" }
ndk-sys = { path = "external/ndk/ndk-sys" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
